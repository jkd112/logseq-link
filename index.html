<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Przekierowanie</title>
    <script>
        const SHORTCUT_NAME = "OtworzMaila";

        function getTargetLink() {
            const url = window.location.href;
            if (url.includes("logseq://")) {
                return decodeURIComponent(url.substring(url.indexOf("logseq://")));
            }
            if (url.includes("message://")) {
                return url.substring(url.indexOf("message://")).split(' ')[0].split('"')[0];
            }
            return "";
        }

        window.onload = function () {
            const targetLink = getTargetLink();
            if (!targetLink) {
                document.getElementById("status").textContent = "Brak linku w adresie.";
                return;
            }

            // Poprawna składnia Skrótów: input=text + osobny parametr text=
            const shortcutUrl = "shortcuts://run-shortcut?name=" + encodeURIComponent(SHORTCUT_NAME)
                + "&input=text&text=" + encodeURIComponent(targetLink);

            document.getElementById("manual").href = shortcutUrl;

            // Zamykamy kartę dopiero, gdy przeglądarka straci fokus (czyli po kliknięciu
            // „Otwórz" w okienku i uruchomieniu Skrótów) — nie na sztywno po czasie,
            // bo to zamykało okienko z pytaniem, zanim zdążyłeś kliknąć.
            let closed = false;
            function closeLater() {
                if (closed) return;
                closed = true;
                setTimeout(function () { window.close(); }, 500);
            }
            window.addEventListener("blur", closeLater);
            document.addEventListener("visibilitychange", function () {
                if (document.hidden) closeLater();
            });

            window.location.href = shortcutUrl;
        };
    </script>
</head>
<body>
    <div style="text-align:center; margin-top:50px; font-family:sans-serif;">
        <p id="status">Przesyłanie do systemu macOS...</p>
        <p style="font-size:0.8em; color:#666;">Kliknij „Otwórz” w okienku przeglądarki. Karta zamknie się sama po uruchomieniu skrótu.</p>
        <p><a id="manual" href="#">Uruchom skrót ręcznie</a></p>
    </div>
</body>
</html>
